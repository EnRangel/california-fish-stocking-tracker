<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>California Fish Stocking</title>

    <link rel="stylesheet" href="popup.css">
  </head>

  <body>
    <header class="popup-header">
      <h1>California Fish Stocking</h1>
      <p>Find recently stocked waters</p>
    </header>

    <!-- data-tab: stores a value JavaScript can read.
        aria-selected: communicates the selected tab to assistive technology.
        aria-controls: identifies the content controlled by the button.
        aria-live="polite": announces updated list content without interrupting the user. -->
  <nav class="tabs" role="tablist" aria-label="Stocking categories">
    <button
      class="tab-button active"
      type="button"
      role="tab"
      data-tab="recent"
      aria-selected="true"
      aria-controls="stocking-list"
    >
      Recent
    </button>

    <button
      class="tab-button"
      type="button"
      role="tab"
      data-tab="upcoming"
      aria-selected="false"
      aria-controls="stocking-list"
    >
      Upcoming
    </button>

    <button
      class="tab-button"
      type="button"
      role="tab"
      data-tab="favorites"
      aria-selected="false"
      aria-controls="stocking-list"
    >
      Favorites
    </button>
  </nav>

<main
  id="stocking-list"
  class="stocking-list"
  role="tabpanel"
  aria-live="polite"
></main>
      <article class="stocking-card">
        <div class="card-heading">
          <h2>Lone Pine Creek</h2>

          <button
            class="favorite-button"
            type="button"
            aria-label="Add Lone Pine Creek to favorites"
            aria-pressed="false"
          >
            ☆
          </button>
        </div>

        <p class="stocking-details">
          Trout · Inyo County
        </p>

        <p class="stocking-week">
          Week of September 20, 2026
        </p>
<!-- rel="noopener noreferrer" prevents the new page from controlling the popup page. -->
        <a
          class="map-link"
          href="https://www.google.com/maps/search/?api=1&amp;query=36.59597397%2C-118.0977478"
          target="_blank"
          rel="noopener noreferrer"
        >
          Open in Google Maps
        </a>
      </article>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
