<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>California Fish Stocking Tracker</title>

    <link rel="stylesheet" href="popup.css">
  </head>

  <body>
    <header class="popup-header">
      <!-- Keep the title above the decorative water layers by grouping the
           readable header content in its own container. -->
      <div class="header-copy">
        <h1>California Fish Stocking Tracker</h1>
        <p>Find recently stocked waters</p>
      </div>

      <!-- Reuse the extension icon as a decorative brand mark. An empty alt
           value prevents a screen reader from repeating the nearby title. -->
      <img
        class="header-icon"
        src="../icons/ripple-beacon.svg"
        alt=""
        aria-hidden="true"
      >

      <!-- These SVG paths draw three overlapping water layers. The SVG is
           decorative, so assistive technology does not need to announce it. -->
      <svg
        class="header-waves"
        viewBox="0 0 380 42"
        preserveAspectRatio="none"
        aria-hidden="true"
      >
        <path
          class="header-wave header-wave--back"
          d="M0 14 C40 2 80 28 125 16 C170 4 210 30 255 16 C300 2 340 28 380 14 V42 H0 Z"
        ></path>
        <path
          class="header-wave header-wave--middle"
          d="M0 23 C45 8 75 35 120 22 C165 10 200 36 245 22 C290 9 335 35 380 21 V42 H0 Z"
        ></path>
        <path
          class="header-wave header-wave--front"
          d="M0 31 C50 16 80 41 130 28 C180 16 215 41 265 28 C315 16 345 39 380 29 V42 H0 Z"
        ></path>
      </svg>
    </header>

    <!-- Show when the data was downloaded and let the user request fresh data. -->
    <div class="data-controls">
      <p class="last-updated">
        Last updated:
        <span id="last-updated-value" aria-live="polite">
          Loading...
        </span>
      </p>

      <button
        id="refresh-button"
        class="refresh-button"
        type="button"
      >
        Refresh data
      </button>
    </div>

    <!-- data-tab: stores a value JavaScript can read.
        aria-selected: communicates the selected tab to assistive technology.
        aria-controls: identifies the content controlled by the button.
        aria-live="polite": announces updated list content without interrupting the user. -->
  <nav class="tabs" role="tablist" aria-label="Stocking categories">
    <button
      class="tab-button active"
      type="button"
      role="tab"
      data-tab="recent"
      aria-selected="true"
      aria-controls="stocking-list"
    >
      Recent
    </button>

    <button
      class="tab-button"
      type="button"
      role="tab"
      data-tab="upcoming"
      aria-selected="false"
      aria-controls="stocking-list"
    >
      Upcoming
    </button>

    <button
      class="tab-button"
      type="button"
      role="tab"
      data-tab="favorites"
      aria-selected="false"
      aria-controls="stocking-list"
    >
      Favorites
    </button>
  </nav>

  <div class="search-container">
    <label class="search-label" for="stocking-search">
      Search stockings
    </label>

    <input
      id="stocking-search"
      class="search-input"
      type="search"
      placeholder="Water, county, or species"
      autocomplete="off"
      spellcheck="false"
    >
  </div>

    <main
      id="stocking-list"
      class="stocking-list"
      role="tabpanel"
      aria-live="polite"
    ></main>

    <!-- Identify the public data source and make the privacy notice easy to
         find. These links open only after the user deliberately selects one. -->
    <footer class="popup-footer">
      <p>
        Unofficial project. Data from
        <a
          href="https://catalog.data.gov/dataset/planting-location-cdfw-ds2897"
          target="_blank"
          rel="noopener noreferrer"
        >CDFW</a>.
        <a
          href="privacy.html"
          target="_blank"
          rel="noopener noreferrer"
        >Privacy</a>
      </p>
    </footer>

    <!-- type="module" enables import and export in the popup scripts. -->
    <script type="module" src="popup.js"></script>
  </body>
</html>
