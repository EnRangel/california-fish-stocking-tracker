<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>California Fish Stocking</title>

    <link rel="stylesheet" href="popup.css">
  </head>

  <body>
    <header class="popup-header">
      <h1>California Fish Stocking</h1>
      <p>Find recently stocked waters</p>
    </header>

    <!-- data-tab: stores a value JavaScript can read.
        aria-selected: communicates the selected tab to assistive technology.
        aria-controls: identifies the content controlled by the button.
        aria-live="polite": announces updated list content without interrupting the user. -->
  <nav class="tabs" role="tablist" aria-label="Stocking categories">
    <button
      class="tab-button active"
      type="button"
      role="tab"
      data-tab="recent"
      aria-selected="true"
      aria-controls="stocking-list"
    >
      Recent
    </button>

    <button
      class="tab-button"
      type="button"
      role="tab"
      data-tab="upcoming"
      aria-selected="false"
      aria-controls="stocking-list"
    >
      Upcoming
    </button>

    <button
      class="tab-button"
      type="button"
      role="tab"
      data-tab="favorites"
      aria-selected="false"
      aria-controls="stocking-list"
    >
      Favorites
    </button>
  </nav>

    <main
      id="stocking-list"
      class="stocking-list"
      role="tabpanel"
      aria-live="polite"
    ></main>

    <script src="popup.js"></script>
  </body>
</html>
